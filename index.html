        const snap = await getDoc(CRED_DOC);
        if (snap.exists()) return snap.data();
      } catch(e) {}
      return { username: "Mezalina", password: "*500*302#Mezalina" };
    }

    localStorage.setItem = function(key, value) {
      _origSet(key, value);
      if (_isSyncing || key === SESSION_KEY) return;
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(saveFB, 2000);
    };

    // Password change function exposed globally
    window.__mzChangePw__ = async function() {
      const cur = document.getElementById("__pw_cur__")?.value;
      const nw = document.getElementById("__pw_new__")?.value;
      const con = document.getElementById("__pw_con__")?.value;
      const msg = document.getElementById("__pw_msg__");
      if (!msg || !cur || !nw || !con) return;
      const creds = await getCreds();
      if (cur !== creds.password) { msg.style.color="#dc2626"; msg.textContent="❌ Current password is incorrect."; return; }
      if (nw.length < 6) { msg.style.color="#dc2626"; msg.textContent="❌ New password must be at least 6 characters."; return; }
      if (nw !== con) { msg.style.color="#dc2626"; msg.textContent="❌ Passwords do not match."; return; }
      await setDoc(CRED_DOC, { username: creds.username, password: nw });
      msg.style.color="#16a34a"; msg.textContent="✅ Password updated successfully!";
      document.getElementById("__pw_cur__").value = "";
      document.getElementById("__pw_new__").value = "";
      document.getElementById("__pw_con__").value = "";
    };

    // Close logout menu when clicking outside
    document.addEventListener("click", function(e) {
      const menu = document.getElementById("__mz_logout_menu__");
      if (menu && !menu.parentElement?.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    function buildLogin(onSuccess) {
      const wall = document.createElement("div");
      wall.id = "__mz_login__";
      wall.innerHTML = `<div class="lb"><div class="ll">M</div><h2>Mezalina BMS</h2><p>Elegance Illuminated</p><label>Username</label><input id="__mz_un__" type="text" placeholder="Enter username" autocomplete="username"/><label>Password</label><input id="__mz_pw__" type="password" placeholder="Enter password" autocomplete="current-password"/><div class="lerr" id="__mz_err__"></div><button class="lbtn" id="__mz_lbtn__">Sign In</button></div>`;
      document.body.appendChild(wall);

      async function tryLogin() {
        const un = document.getElementById("__mz_un__").value.trim();
        const pw = document.getElementById("__mz_pw__").value;
        const creds = await getCreds();
        if (un === creds.username && pw === creds.password) {
          _origSet(SESSION_KEY, "1");
          wall.remove();
          onSuccess();
        } else {
          document.getElementById("__mz_err__").textContent = "❌ Incorrect username or password.";
          document.getElementById("__mz_pw__").value = "";
        }
      }

      document.getElementById("__mz_lbtn__").addEventListener("click", tryLogin);
      document.addEventListener("keydown", function h(e) {
        if (e.key === "Enter" && document.getElementById("__mz_login__")) tryLogin();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      const loggedIn = _origGet(SESSION_KEY) === "1";
      if (loggedIn) loadFB();
      else buildLogin(loadFB);
    });
  </script>
  </head>

    <div id="root"></div>
